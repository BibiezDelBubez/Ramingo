<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" preserveAspectRatio="xMidYMid slice" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <!-- Cielo blu notte -->
    <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05072a"/>
      <stop offset="0.6" stop-color="#13155a"/>
      <stop offset="1" stop-color="#1f2170"/>
    </linearGradient>
    <!-- Velatura tipo via lattea -->
    <radialGradient id="foschia" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4a4fc4" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#4a4fc4" stop-opacity="0"/>
    </radialGradient>
    <!-- Alone delle stelle della costellazione -->
    <radialGradient id="alone" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe28a" stop-opacity="0.75"/>
      <stop offset="0.35" stop-color="#ffd13a" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#ffd13a" stop-opacity="0"/>
    </radialGradient>
    <!-- Scia delle stelle cadenti -->
    <linearGradient id="scia" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.9"/>
    </linearGradient>
    <!-- Luce lunare -->
    <radialGradient id="luceLuna" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff4cf" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#fff4cf" stop-opacity="0"/>
    </radialGradient>
    <!-- Falce: disco pieno meno un disco spostato -->
    <mask id="falce">
      <circle cx="95" cy="100" r="26" fill="#ffffff"/>
      <circle cx="107" cy="91" r="23" fill="#000000"/>
    </mask>
  </defs>

  <!-- Sfondo -->
  <rect width="800" height="600" fill="url(#cielo)"/>
  <ellipse cx="400" cy="300" rx="520" ry="170" fill="url(#foschia)" transform="rotate(-22 400 300)"/>

  <!-- Polvere di stelle: puntini fissi e tenui -->
  <g fill="#ffffff" opacity="0.45">
    <circle cx="22" cy="95" r="0.5"/><circle cx="68" cy="215" r="0.6"/><circle cx="98" cy="290" r="0.5"/>
    <circle cx="135" cy="345" r="0.6"/><circle cx="178" cy="395" r="0.5"/><circle cx="85" cy="480" r="0.6"/>
    <circle cx="140" cy="515" r="0.5"/><circle cx="235" cy="560" r="0.6"/><circle cx="215" cy="85" r="0.5"/>
    <circle cx="290" cy="60" r="0.6"/><circle cx="300" cy="185" r="0.5"/><circle cx="275" cy="265" r="0.6"/>
    <circle cx="190" cy="180" r="0.5"/><circle cx="305" cy="470" r="0.5"/><circle cx="455" cy="500" r="0.6"/>
    <circle cx="480" cy="590" r="0.5"/><circle cx="530" cy="545" r="0.6"/><circle cx="600" cy="520" r="0.5"/>
    <circle cx="665" cy="585" r="0.6"/><circle cx="725" cy="505" r="0.5"/><circle cx="780" cy="560" r="0.6"/>
    <circle cx="690" cy="430" r="0.5"/><circle cx="600" cy="420" r="0.6"/><circle cx="515" cy="340" r="0.5"/>
    <circle cx="620" cy="305" r="0.6"/><circle cx="705" cy="265" r="0.5"/><circle cx="785" cy="225" r="0.6"/>
    <circle cx="560" cy="180" r="0.5"/><circle cx="655" cy="120" r="0.6"/><circle cx="715" cy="20" r="0.5"/>
    <circle cx="600" cy="25" r="0.6"/><circle cx="505" cy="120" r="0.5"/><circle cx="400" cy="20" r="0.6"/>
    <circle cx="330" cy="105" r="0.5"/><circle cx="160" cy="60" r="0.6"/>
  </g>

  <!-- Luna crescente -->
  <circle cx="95" cy="100" r="70" fill="url(#luceLuna)"/>
  <circle cx="95" cy="100" r="26" fill="#fff4cf" mask="url(#falce)"/>

  <!-- Stelle di sfondo che brillano -->
  <g fill="#ffffff">
    <circle cx="45" cy="40" r="1.2"><animate attributeName="opacity" values="1;0.25;1" dur="3.1s" begin="0s" repeatCount="indefinite"/></circle>
    <circle cx="175" cy="130" r="0.8"><animate attributeName="opacity" values="1;0.25;1" dur="4.2s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="190" cy="30" r="1.5" fill="#fff3c4"><animate attributeName="opacity" values="1;0.3;1" dur="2.7s" begin="0.5s" repeatCount="indefinite"/></circle>
    <circle cx="260" cy="140" r="1"><animate attributeName="opacity" values="1;0.25;1" dur="3.6s" begin="2s" repeatCount="indefinite"/></circle>
    <circle cx="75" cy="180" r="1.3"><animate attributeName="opacity" values="1;0.25;1" dur="5s" begin="1.5s" repeatCount="indefinite"/></circle>
    <circle cx="150" cy="250" r="0.9"><animate attributeName="opacity" values="1;0.25;1" dur="3.3s" begin="0.2s" repeatCount="indefinite"/></circle>
    <circle cx="230" cy="310" r="1.4" fill="#fff3c4"><animate attributeName="opacity" values="1;0.3;1" dur="4.4s" begin="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="40" cy="330" r="1"><animate attributeName="opacity" values="1;0.25;1" dur="2.9s" begin="1.2s" repeatCount="indefinite"/></circle>
    <circle cx="110" cy="420" r="1.6"><animate attributeName="opacity" values="1;0.3;1" dur="3.8s" begin="0.7s" repeatCount="indefinite"/></circle>
    <circle cx="200" cy="470" r="1"><animate attributeName="opacity" values="1;0.25;1" dur="4.9s" begin="3s" repeatCount="indefinite"/></circle>
    <circle cx="60" cy="540" r="1.2"><animate attributeName="opacity" values="1;0.25;1" dur="3.2s" begin="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="160" cy="575" r="0.8"><animate attributeName="opacity" values="1;0.25;1" dur="4.1s" begin="0.4s" repeatCount="indefinite"/></circle>
    <circle cx="270" cy="530" r="1.3" fill="#fff3c4"><animate attributeName="opacity" values="1;0.3;1" dur="2.8s" begin="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="290" cy="410" r="0.9"><animate attributeName="opacity" values="1;0.25;1" dur="5.3s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="340" cy="520" r="1.1"><animate attributeName="opacity" values="1;0.25;1" dur="3.5s" begin="0.9s" repeatCount="indefinite"/></circle>
    <circle cx="380" cy="590" r="0.9"><animate attributeName="opacity" values="1;0.25;1" dur="3.7s" begin="1.3s" repeatCount="indefinite"/></circle>
    <circle cx="420" cy="560" r="1.5"><animate attributeName="opacity" values="1;0.3;1" dur="4.6s" begin="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="500" cy="505" r="0.9"><animate attributeName="opacity" values="1;0.25;1" dur="3s" begin="1.6s" repeatCount="indefinite"/></circle>
    <circle cx="560" cy="575" r="1.2" fill="#fff3c4"><animate attributeName="opacity" values="1;0.3;1" dur="4.3s" begin="0.3s" repeatCount="indefinite"/></circle>
    <circle cx="620" cy="470" r="1.6"><animate attributeName="opacity" values="1;0.3;1" dur="3.7s" begin="2.1s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="540" r="1"><animate attributeName="opacity" values="1;0.25;1" dur="2.6s" begin="1.1s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="480" r="1.3"><animate attributeName="opacity" values="1;0.25;1" dur="4.8s" begin="0.6s" repeatCount="indefinite"/></circle>
    <circle cx="540" cy="400" r="1"><animate attributeName="opacity" values="1;0.25;1" dur="3.4s" begin="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="650" cy="360" r="1.4" fill="#fff3c4"><animate attributeName="opacity" values="1;0.3;1" dur="5.1s" begin="0.8s" repeatCount="indefinite"/></circle>
    <circle cx="740" cy="300" r="0.9"><animate attributeName="opacity" values="1;0.25;1" dur="3.2s" begin="1.9s" repeatCount="indefinite"/></circle>
    <circle cx="580" cy="280" r="1.2"><animate attributeName="opacity" values="1;0.25;1" dur="4s" begin="1.4s" repeatCount="indefinite"/></circle>
    <circle cx="690" cy="220" r="1.5"><animate attributeName="opacity" values="1;0.3;1" dur="2.9s" begin="0.1s" repeatCount="indefinite"/></circle>
    <circle cx="770" cy="150" r="1"><animate attributeName="opacity" values="1;0.25;1" dur="3.9s" begin="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="610" cy="160" r="0.8"><animate attributeName="opacity" values="1;0.25;1" dur="4.7s" begin="1.7s" repeatCount="indefinite"/></circle>
    <circle cx="550" cy="90" r="1.3" fill="#fff3c4"><animate attributeName="opacity" values="1;0.3;1" dur="3.3s" begin="0.4s" repeatCount="indefinite"/></circle>
    <circle cx="650" cy="40" r="1"><animate attributeName="opacity" values="1;0.25;1" dur="4.5s" begin="2.9s" repeatCount="indefinite"/></circle>
    <circle cx="740" cy="70" r="1.6"><animate attributeName="opacity" values="1;0.3;1" dur="3.6s" begin="1.3s" repeatCount="indefinite"/></circle>
    <circle cx="450" cy="40" r="1.1"><animate attributeName="opacity" values="1;0.25;1" dur="2.8s" begin="2s" repeatCount="indefinite"/></circle>
    <circle cx="360" cy="70" r="0.9"><animate attributeName="opacity" values="1;0.25;1" dur="4.1s" begin="0.6s" repeatCount="indefinite"/></circle>
    <circle cx="520" cy="210" r="1"><animate attributeName="opacity" values="1;0.25;1" dur="3.8s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="250" cy="215" r="0.8"><animate attributeName="opacity" values="1;0.25;1" dur="3.1s" begin="2.7s" repeatCount="indefinite"/></circle>
    <circle cx="30" cy="250" r="0.9"><animate attributeName="opacity" values="1;0.25;1" dur="4.6s" begin="0.9s" repeatCount="indefinite"/></circle>
    <circle cx="790" cy="400" r="1"><animate attributeName="opacity" values="1;0.25;1" dur="3s" begin="1.5s" repeatCount="indefinite"/></circle>
    <circle cx="10" cy="450" r="1.1"><animate attributeName="opacity" values="1;0.25;1" dur="4s" begin="0.2s" repeatCount="indefinite"/></circle>
  </g>

  <!-- Qualche rara stella lilla, richiamo discreto al viola del logo -->
  <g fill="#bba3ff">
    <circle cx="735" cy="150" r="1.6"><animate attributeName="opacity" values="1;0.45;1" dur="3.4s" begin="0.7s" repeatCount="indefinite"/></circle>
    <circle cx="645" cy="368" r="1.5"><animate attributeName="opacity" values="1;0.45;1" dur="4.2s" begin="2.1s" repeatCount="indefinite"/></circle>
    <circle cx="172" cy="252" r="1.5"><animate attributeName="opacity" values="1;0.45;1" dur="3.8s" begin="1.3s" repeatCount="indefinite"/></circle>
    <circle cx="58" cy="540" r="1.6"><animate attributeName="opacity" values="1;0.45;1" dur="4.6s" begin="0.4s" repeatCount="indefinite"/></circle>
    <circle cx="748" cy="478" r="1.4"><animate attributeName="opacity" values="1;0.45;1" dur="3.1s" begin="2.8s" repeatCount="indefinite"/></circle>
  </g>

  <!-- Stella cadente: ogni 9s, in alto a destra -->
  <g transform="translate(520 50) rotate(28)">
    <g opacity="0">
      <animateTransform attributeName="transform" type="translate" values="0 0;300 0;300 0" keyTimes="0;0.13;1" dur="9s" begin="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.03;0.13;1" dur="9s" begin="6s" repeatCount="indefinite"/>
      <polygon points="0,0 -110,-1.2 -110,1.2" fill="url(#scia)"/>
      <circle cx="0" cy="0" r="1.8" fill="#ffffff"/>
    </g>
  </g>

  <!-- Seconda stella cadente, più piccola: ogni 13s, in basso a sinistra -->
  <g transform="translate(70 310) rotate(20)">
    <g opacity="0">
      <animateTransform attributeName="transform" type="translate" values="0 0;220 0;220 0" keyTimes="0;0.07;1" dur="13s" begin="10s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.8;0;0" keyTimes="0;0.015;0.07;1" dur="13s" begin="10s" repeatCount="indefinite"/>
      <polygon points="0,0 -80,-0.9 -80,0.9" fill="url(#scia)"/>
      <circle cx="0" cy="0" r="1.3" fill="#ffffff"/>
    </g>
  </g>
</svg>