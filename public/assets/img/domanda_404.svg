<svg xmlns="http://www.w3.org/2000/svg" viewBox="310 110 180 370" width="180" height="370" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Costellazione a punto di domanda, separata dallo sfondo per poterla centrare sopra il testo -->
  <defs>
    <!-- Alone delle stelle della costellazione -->
    <radialGradient id="alone" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe28a" stop-opacity="0.75"/>
      <stop offset="0.35" stop-color="#ffd13a" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#ffd13a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Linee della costellazione: si disegnano in 4s, poi pulsano piano -->
  <path d="M335 215 L355 160 L405 135 L458 160 L470 215 L440 262 L405 295 L400 355"
        fill="none" stroke="#ffe28a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"
        pathLength="100" stroke-dasharray="100" stroke-dashoffset="100" opacity="0.55">
    <animate attributeName="stroke-dashoffset" from="100" to="0" dur="4s" begin="0.5s" fill="freeze"/>
    <animate attributeName="opacity" values="0.55;0.3;0.55" dur="4s" begin="5s" repeatCount="indefinite"/>
  </path>

  <!-- Stelle della costellazione: compaiono quando la linea le raggiunge -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.5s" fill="freeze"/>
    <circle cx="335" cy="215" r="13" fill="url(#alone)"><animate attributeName="r" values="13;17;13" dur="3.2s" begin="0.5s" repeatCount="indefinite"/></circle>
    <circle cx="335" cy="215" r="2.6" fill="#fffbe6"/>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.1s" fill="freeze"/>
    <circle cx="355" cy="160" r="12" fill="url(#alone)"><animate attributeName="r" values="12;16;12" dur="2.7s" begin="1.1s" repeatCount="indefinite"/></circle>
    <circle cx="355" cy="160" r="2.3" fill="#fffbe6"/>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.66s" fill="freeze"/>
    <circle cx="405" cy="135" r="15" fill="url(#alone)"><animate attributeName="r" values="15;20;15" dur="3.6s" begin="1.66s" repeatCount="indefinite"/></circle>
    <circle cx="405" cy="135" r="3" fill="#fffbe6"/>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="2.26s" fill="freeze"/>
    <circle cx="458" cy="160" r="12" fill="url(#alone)"><animate attributeName="r" values="12;16;12" dur="2.9s" begin="2.26s" repeatCount="indefinite"/></circle>
    <circle cx="458" cy="160" r="2.4" fill="#fffbe6"/>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="2.83s" fill="freeze"/>
    <circle cx="470" cy="215" r="14" fill="url(#alone)"><animate attributeName="r" values="14;18;14" dur="3.4s" begin="2.83s" repeatCount="indefinite"/></circle>
    <circle cx="470" cy="215" r="2.8" fill="#fffbe6"/>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="3.4s" fill="freeze"/>
    <circle cx="440" cy="262" r="11" fill="url(#alone)"><animate attributeName="r" values="11;15;11" dur="2.6s" begin="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="440" cy="262" r="2.2" fill="#fffbe6"/>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="3.89s" fill="freeze"/>
    <circle cx="405" cy="295" r="12" fill="url(#alone)"><animate attributeName="r" values="12;16;12" dur="3.1s" begin="3.89s" repeatCount="indefinite"/></circle>
    <circle cx="405" cy="295" r="2.4" fill="#fffbe6"/>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="4.5s" fill="freeze"/>
    <circle cx="400" cy="355" r="13" fill="url(#alone)"><animate attributeName="r" values="13;17;13" dur="3.3s" begin="4.5s" repeatCount="indefinite"/></circle>
    <circle cx="400" cy="355" r="2.6" fill="#fffbe6"/>
  </g>

  <!-- Il punto del "?": la stella più luminosa, con raggi a croce -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="5s" fill="freeze"/>
    <circle cx="400" cy="440" r="22" fill="url(#alone)"><animate attributeName="r" values="22;28;22" dur="2.4s" begin="5s" repeatCount="indefinite"/></circle>
    <path d="M400 418 L402.2 437.8 L422 440 L402.2 442.2 L400 462 L397.8 442.2 L378 440 L397.8 437.8 Z" fill="#fff6d0">
      <animate attributeName="opacity" values="1;0.5;1" dur="2.4s" begin="5s" repeatCount="indefinite"/>
    </path>
    <circle cx="400" cy="440" r="3.6" fill="#ffffff"/>
  </g>

  <!-- Impulso di luce che percorre la costellazione ogni 8s -->
  <g opacity="0">
    <animateMotion path="M335 215 L355 160 L405 135 L458 160 L470 215 L440 262 L405 295 L400 355"
                   keyPoints="0;1;1" keyTimes="0;0.375;1" calcMode="linear" dur="8s" begin="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.33;0.375;1" dur="8s" begin="6s" repeatCount="indefinite"/>
    <circle r="7" fill="url(#alone)"/>
    <circle r="1.6" fill="#ffffff"/>
  </g>

</svg>
